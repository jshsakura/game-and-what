name: CI

# Runs on EVERY push to main and every pull request — which, until 2026-07-27, nothing
# did. The release workflow gates on tests, but it only fires on a version tag, so a
# broken commit stayed invisible until someone cut a release: 254 commits went in over
# one 30-day stretch without a single test run. This is that gap closed.
#
# The release workflow keeps its own copy of the test gate on purpose. A tag must not
# publish an image because CI happened to be green on some earlier commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant — cancel it
# rather than pay for both. Never cancel on main: those runs are the record of what
# landed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend deps + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run tests
        working-directory: backend
        # Same toggles the release workflow sets, and for the same reason: the suite is
        # written for the fork build (experimental systems + Korean features), which
        # locally come from a git-ignored .env that CI does not have. Without these the
        # experimental-gated endpoints 403 and their tests fail.
        env:
          GNW_EXPERIMENTAL_MODE: "true"
          GNW_KOREAN_MODE: "true"
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile's frontend-builder stage. A build that only passes on
          # a newer Node than the image uses is not a build that passes.
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        # The whole gate: the SPA had NO build check anywhere before this. A syntax error
        # in a .jsx reached main and was only caught when the release image failed to
        # build — or worse, when the Pages deploy shipped it.
        run: npm run build
