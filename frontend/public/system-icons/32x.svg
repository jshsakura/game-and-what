<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Sega 32X</title>
  <desc id="desc">A simplified front view of the distinctive Sega 32X mushroom-shaped console add-on.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#414141"/>
      <stop offset="1" stop-color="#181818"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#292929"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
  </defs>

  <!-- Tall cartridge receiver: the part that gives the 32X its mushroom profile. -->
  <path fill="url(#top)" stroke="#080808" stroke-width="24" d="M318 190Q318 142 366 142h268q48 0 48 48v268H318Z"/>
  <rect x="371" y="193" width="258" height="52" rx="22" fill="#090909" stroke="#686868" stroke-width="12"/>
  <rect x="401" y="211" width="198" height="16" rx="8" fill="#262626"/>

  <!-- Wide lower shell, with the characteristic rounded left and right wings. -->
  <path fill="url(#front)" stroke="#080808" stroke-width="26" d="M318 376h364q37 0 64 26l128 123q47 45 47 110v75q0 76-76 76H155q-76 0-76-76v-75q0-65 47-110l128-123q27-26 64-26Z"/>
  <path fill="#353535" d="M119 604q34-35 85-35h592q51 0 85 35l26 27H93Z" opacity=".72"/>
  <path fill="#050505" d="M92 680h816v43q0 51-51 51H143q-51 0-51-51Z"/>

  <!-- Front face and power details. -->
  <rect x="278" y="486" width="444" height="190" rx="56" fill="#1b1b1b" stroke="#494949" stroke-width="12"/>
  <circle cx="213" cy="645" r="25" fill="#bd2f28" stroke="#080808" stroke-width="12"/>
  <circle cx="787" cy="645" r="25" fill="#2d8b49" stroke="#080808" stroke-width="12"/>
  <rect x="405" y="705" width="190" height="34" rx="16" fill="#373737" stroke="#050505" stroke-width="9"/>

  <!-- A bold label remains legible at the small size used by the library tabs. -->
  <text x="500" y="610" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="126" font-weight="900" font-style="italic" letter-spacing="-10" fill="#f0f0f0" stroke="#050505" stroke-width="10" paint-order="stroke">32X</text>
  <path d="M363 628h274" stroke="#c43a2d" stroke-width="16" stroke-linecap="round"/>
</svg>
