services:
  game-and-what:
    container_name: game-and-what
    # Pull the published multi-arch image, OR build locally (the `build:` below).
    # With both set, `docker compose build` tags the build as this image name.
    image: ghcr.io/jshsakura/game-and-what:latest
    build:
      context: .
      args:
        # Match the container user to the host owner of the data dir (this
        # host's `ubuntu` is uid 1001). Override: UID=1000 docker compose build
        UID: ${UID:-1001}
    # Host port is overridable: GNW_HOST_PORT=12345 docker compose up -d
    # Default 38472 is intentionally uncommon so it doesn't clash with other
    # services; attach your tunnel to this port.
    ports:
      - "${GNW_HOST_PORT:-38472}:8080"
    volumes:
      # Bind mount — uploaded files + the SQLite DB live on the host and survive
      # restarts. Default ./data sits next to this compose file; set GNW_DATA_PATH
      # to an absolute path to store it elsewhere. Match the host owner's uid via
      # the UID build arg (see above) so the container can write without chown.
      - ${GNW_DATA_PATH:-./data}:/app/backend/data
    environment:
      # Override any config via env; defaults match the app's config.py.
      # All keys are OPTIONAL — values come from a .env beside this file (compose
      # auto-loads it). See .env.example. Empty = that provider disabled; app still works.
      GNW_DATA_DIR: /app/backend/data
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      TGDB_API_KEY: ${TGDB_API_KEY:-}
      STEAMGRIDDB_API_KEY: ${STEAMGRIDDB_API_KEY:-}
      # Korea-specific features — public image keeps this off.
      GNW_KOREAN_MODE: ${GNW_KOREAN_MODE:-false}
      # "Personal lab" mode: fork-firmware extras (systems beyond the upstream
      # sylverb set, the MEDIA tab converters). Off = official feature set only.
      GNW_EXPERIMENTAL_MODE: ${GNW_EXPERIMENTAL_MODE:-false}
      # The knobs .env.example documents. They have to be listed HERE to have any
      # effect: the app's own .env loader reads the project-root .env, but
      # .dockerignore keeps that file out of the image, and compose's auto-loaded
      # .env only feeds ${...} substitution in THIS file — it is not handed to the
      # container. Without these lines, setting them did nothing at all in Docker.
      #
      # Unset ones arrive as an empty string, which config.py reads as "not
      # configured" (see _env/_env_int there) — so an absent .env keeps every default.
      GNW_CORS_ORIGINS: ${GNW_CORS_ORIGINS:-}
      GNW_MAX_ROM_BYTES: ${GNW_MAX_ROM_BYTES:-}
      GNW_MAX_VIDEO_BYTES: ${GNW_MAX_VIDEO_BYTES:-}
      GNW_MAX_MUSIC_BYTES: ${GNW_MAX_MUSIC_BYTES:-}
      GNW_MAX_FIRMWARE_BYTES: ${GNW_MAX_FIRMWARE_BYTES:-}
      GNW_MAX_EXTRA_BYTES: ${GNW_MAX_EXTRA_BYTES:-}
      GNW_MAX_CD_FILE_BYTES: ${GNW_MAX_CD_FILE_BYTES:-}
      GNW_MAX_CD_TOTAL_BYTES: ${GNW_MAX_CD_TOTAL_BYTES:-}
      GNW_MAX_CHUNK_BYTES: ${GNW_MAX_CHUNK_BYTES:-}
      GNW_MAX_UPLOAD_TOTAL_BYTES: ${GNW_MAX_UPLOAD_TOTAL_BYTES:-}
    restart: unless-stopped
